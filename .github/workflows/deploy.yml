name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - master

concurrency:
  group: aoetauntbot-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - aoetauntbot

    steps:
      - name: Deploy Bot
        shell: bash
        run: |
          set -euo pipefail

          cd ~/aoe_bot || cd ~/AoeTauntBot || exit 1

          git fetch origin master
          git checkout master
          git reset --hard origin/master
          git clean -fd

          docker compose up -d --build

          echo "Waiting for bot to boot..."
          sleep 5
          docker logs aoetauntbot --tail 100

          echo "Deployment Complete!"
