name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy Bot
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          # The script to run on the Oracle instance after SSH connects
          script: |
            # Navigate to whichever folder exists
            cd ~/aoe_bot || cd ~/AoeTauntBot || exit 1
            
            # Pull the latest code
            git pull origin master
            
            # Rebuild the docker environment and seamlessly restart the bot
            docker compose up -d --build
            
            # Print the docker logs so we can see if the bot crashed on startup
            echo "Waiting for bot to boot..."
            sleep 5
            docker logs aoetauntbot --tail 100
            
            echo "Deployment Complete!"
